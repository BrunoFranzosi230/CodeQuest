# Análise estática no SonarCloud — exigida pelo Portfolio Directions.
#
# Para ligar:
#   1. sonarcloud.io → importar o repositório do GitHub
#   2. copiar a chave do projeto e da organização para as linhas abaixo
#   3. salvar o token em Settings → Secrets → Actions como SONAR_TOKEN
# O workflow .github/workflows/ci.yml já envia a cobertura.

sonar.projectKey=SUBSTITUA_pela_chave_do_projeto
sonar.organization=SUBSTITUA_pela_organizacao
sonar.projectName=CodeQuest
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Cobertura gerada por `npm run coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fora da análise: build, dependências, relatórios e ferramenta de desenvolvimento
sonar.exclusions=dist/**,node_modules/**,coverage/**,src/dev/**
sonar.coverage.exclusions=tests/**,src/dev/**,src/scenes/**,src/ui/**,src/styles/**,src/main.js
