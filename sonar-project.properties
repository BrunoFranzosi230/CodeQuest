# Análise estática no SonarCloud — exigida pelo Portfolio Directions.
#
# Projeto: https://sonarcloud.io/project/overview?id=BrunoFranzosi230_CodeQuest
# A análise roda no CI (.github/workflows/ci.yml), que também envia a
# cobertura dos testes. Exige o segredo SONAR_TOKEN no repositório e a
# "Automatic Analysis" desligada no SonarCloud (as duas não podem coexistir).

sonar.projectKey=BrunoFranzosi230_CodeQuest
sonar.organization=brunofranzosi230
sonar.projectName=CodeQuest
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Cobertura gerada por `npm run coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fora da análise: build, dependências, relatórios e ferramenta de desenvolvimento
sonar.exclusions=dist/**,node_modules/**,coverage/**,src/dev/**
# Mesmo recorte do Vitest (vite.config.js): cobertura mede domínio e dados;
# telas, cenas e a orquestração delas (UIManager) são apresentação.
sonar.coverage.exclusions=tests/**,src/dev/**,src/scenes/**,src/ui/**,src/styles/**,src/main.js,src/config.js,src/core/UIManager.js
