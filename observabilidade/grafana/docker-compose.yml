# Grafana local com o painel do CodeQuest já configurado.
#   docker compose up -d     →  http://localhost:3000  (admin / admin no 1º acesso)
# A senha do banco vem do .env.local da raiz do projeto (GRAFANA_DB_PASSWORD),
# que não vai para o git. Ver LEIA-ME.md.
services:
  grafana:
    image: grafana/grafana:12.2.1
    container_name: codequest-grafana
    ports:
      - "3000:3000"
    env_file:
      - ../../.env.local
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/codequest.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-dados:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-dados:
