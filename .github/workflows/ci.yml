name: CI — lint, testes e cobertura

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Um push novo na mesma branch cancela a execução anterior, que já ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade de código
    runs-on: ubuntu-latest
    env:
      # Exposto no job para o `if` do passo do Sonar conseguir enxergá-lo.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # o Sonar precisa do histórico para o blame

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática (ESLint)
        run: npm run lint

      # A meta de 50% está no vite.config.js; `npm run coverage` já falha abaixo dela.
      - name: Testes com cobertura
        run: npm run coverage

      - name: Publicar cobertura no resumo
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const linha = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log("### Cobertura dos sistemas de lógica de jogo\n");
            console.log("| Métrica | % | Cobertos |\n|---|---|---|");
            ["lines", "statements", "functions", "branches"].forEach(k => console.log(linha(k)));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      # Só roda depois de configurar sonar-project.properties e o segredo SONAR_TOKEN
      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5

  build:
    name: Build de produção
    needs: qualidade        # não builda se lint ou teste falhar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Guardar build
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 14
