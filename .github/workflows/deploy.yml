name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo no nível do workflow; quem publica ganha escrita só no próprio job.
permissions:
  contents: read

# Uma publicação por vez; não cancela a que já está em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      # Portão de qualidade: nada vai para produção sem passar no lint e nos
      # testes. É o que impede publicar uma fase impossível de resolver.
      - name: Análise estática
        run: npm run lint

      - name: Testes com cobertura
        run: npm run coverage

      - name: Build de produção
        run: npm run build
        env:
          # Valores públicos (vão embarcados no JS). Configure em
          # Settings → Secrets and variables → Actions → aba "Variables".
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publicar no GitHub Pages
      id-token: write   # o deploy-pages se autentica via OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
